name: epsilon-wire-tests

on:
  push:
    paths:
      - "epsilon-wire/**"
  pull_request:
    paths:
      - "epsilon-wire/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epsilon-wire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
