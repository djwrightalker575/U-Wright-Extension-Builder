name: WIRE Android Browser v0.1

on:
  push:
    branches:
      - wire-android-browser-v0.1
    paths:
      - ".github/workflows/wire-android-browser-v0.1.yml"
      - "wire-android-browser/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: wire-android-browser-v0.1

      - name: Materialize WIRE Android source
        shell: bash
        run: |
          cat > /tmp/wire-src.b64 <<'WIRE_EOF'
          
          WIRE_EOF
          base64 -d -i /tmp/wire-src.b64 > /tmp/wire-src.tgz
          tar -xzf /tmp/wire-src.tgz
          test -f wire-android-browser/app/src/main/java/com/uwright/wirebrowser/MainActivity.java
          test -f wire-android-browser/titanium-extension/manifest.json

      - name: Commit materialized source to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wire-android-browser
          if ! git diff --cached --quiet; then
            git commit -m "materialize WIRE Android Browser v0.1 source"
            git push origin HEAD:wire-android-browser-v0.1 || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: wire-android-browser
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Package outputs
        shell: bash
        run: |
          cp wire-android-browser/app/build/outputs/apk/debug/app-debug.apk WIRE-Android-Browser-v0.1-debug.apk
          tar -czf WIRE-Android-Browser-v0.1-source.tgz wire-android-browser
          sha256sum WIRE-Android-Browser-v0.1-debug.apk WIRE-Android-Browser-v0.1-source.tgz > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WIRE-Android-Browser-v0.1
          path: |
            WIRE-Android-Browser-v0.1-debug.apk
            WIRE-Android-Browser-v0.1-source.tgz
            SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wire-android-v0.1-${{ github.run_number }}
          name: WIRE Android Browser v0.1 build ${{ github.run_number }}
          body: |
            First runnable WIRE Android Browser build.
            Includes the APK, complete source snapshot, Titanium extension scaffold, and SHA-256 checksums.
          files: |
            WIRE-Android-Browser-v0.1-debug.apk
            WIRE-Android-Browser-v0.1-source.tgz
            SHA256SUMS.txt
