name: W.A.R Wired.Android.Runtime v0.2.0
# build-attempt: 5

on:
  push:
    branches:
      - wire-android-runtime-v0.2.0
    paths:
      - ".github/workflows/war-android-runtime-v0.2.0.yml"
      - "wire-android-browser/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: wire-android-runtime-v0.2.0

      - name: Verify architecture source
        shell: bash
        run: |
          set -euo pipefail
          test -f wire-android-browser/app/src/main/java/com/uwright/wirebrowser/MainActivity.java
          test -f wire-android-browser/app/src/main/java/com/uwright/wirebrowser/TruthStore.java
          test -f wire-android-browser/app/src/main/java/com/uwright/wirebrowser/ContextCompiler.java
          test -f wire-android-browser/app/src/main/assets/war_architecture_contract.json
          test -f wire-android-browser/app/src/main/res/drawable/ic_war_foreground.xml
          test -f wire-android-browser/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -F "versionName '0.2.0'" wire-android-browser/app/build.gradle
          grep -F 'private static final String VERSION = "0.2.0";' wire-android-browser/app/src/main/java/com/uwright/wirebrowser/MainActivity.java
          grep -F 'case "runtime_truth"' wire-android-browser/app/src/main/java/com/uwright/wirebrowser/MainActivity.java
          grep -F 'case "context_for_task"' wire-android-browser/app/src/main/java/com/uwright/wirebrowser/MainActivity.java
          grep -F 'WAR_TRUTH_V1' wire-android-browser/app/src/main/java/com/uwright/wirebrowser/TruthStore.java
          grep -F 'WAR_CONTEXT_V1' wire-android-browser/app/src/main/java/com/uwright/wirebrowser/ContextCompiler.java
          grep -F 'native_clipboard_paste_send_ready_click_user_turn_observed' wire-android-browser/app/src/main/java/com/uwright/wirebrowser/MainActivity.java

      - name: Validate architecture contract JSON
        shell: bash
        run: python3 -m json.tool wire-android-browser/app/src/main/assets/war_architecture_contract.json >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: wire-android-browser
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK contains W.A.R runtime classes
        shell: bash
        run: |
          APK=wire-android-browser/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'resources.arsc'

      - name: Package outputs
        shell: bash
        run: |
          cp wire-android-browser/app/build/outputs/apk/debug/app-debug.apk WAR-Wired-Android-Runtime-v0.2.0-debug.apk
          tar --exclude='wire-android-browser/app/build' --exclude='wire-android-browser/.gradle' -czf WAR-Wired-Android-Runtime-v0.2.0-source.tgz wire-android-browser
          sha256sum WAR-Wired-Android-Runtime-v0.2.0-debug.apk WAR-Wired-Android-Runtime-v0.2.0-source.tgz > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAR-Wired-Android-Runtime-v0.2.0
          path: |
            WAR-Wired-Android-Runtime-v0.2.0-debug.apk
            WAR-Wired-Android-Runtime-v0.2.0-source.tgz
            SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: war-android-v0.2.0-${{ github.run_number }}
          name: W.A.R — Wired.Android.Runtime v0.2.0 build ${{ github.run_number }}
          body: |
            First W.A.R architecture build.
            
            Adds the persistent WAR_TRUTH_V1 SQLite truth store, WAR_CONTEXT_V1 context compiler, architecture invariants, capability maturity tracking, decision/fact/mission records, task-specific context hydration, runtime-truth actions, and dedicated W.A.R launcher branding.
            
            The physically verified V0.1.5 ChatGPT auto-return mechanism is intentionally retained rather than replaced. Physical-device verification of the new v0.2.0 truth/context layer is still required after installation.
          files: |
            WAR-Wired-Android-Runtime-v0.2.0-debug.apk
            WAR-Wired-Android-Runtime-v0.2.0-source.tgz
            SHA256SUMS.txt
